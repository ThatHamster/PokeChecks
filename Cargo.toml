[package]
name = "pokechecks"
version = "0.3.0"
edition = "2024"
rust-version = "1.99"
description = "Pokémon Champions ranked usage compared side by side with base stats"
license = "MIT"
publish = false

[workspace]
members = ["crates/core", "crates/wasm"]

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
maud = "0.27.0"
pokechecks-core = { path = "crates/core" }
regex = "1.13.1"
# native-tls uses Windows SChannel / macOS Security / OpenSSL, so no extra C toolchain is needed.
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "json", "gzip", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_urlencoded = "0.7.1"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "net", "sync", "signal", "time"] }
tower-http = { version = "0.6.11", features = ["cors", "compression-gzip", "compression-br"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

# The app's WebAssembly build: `cargo build -p pokechecks-wasm --target wasm32-unknown-unknown
# --profile wasm`. Smaller rather than faster, since it ships inside the app.
[profile.wasm]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"

