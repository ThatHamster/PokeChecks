# Render Blueprint: creates the PokeChecks web service from the Dockerfile and redeploys on
# every push to main. See the README's "Deploy" section.
services:
  - type: web
    name: pokechecks
    runtime: docker
    # Starter stays on. The free plan sleeps when idle, and every wake-up downloads the
    # Pokédex and usage stats again.
    plan: starter
    branch: main
    autoDeploy: true
    healthCheckPath: /healthz
    envVars:
      # Your Ko-fi or GitHub Sponsors page for the footer's support link. Set it in the
      # Render dashboard; leave it empty to hide the link.
      - key: SUPPORT_URL
        sync: false
      # The contact address shown in the privacy policy (/privacy), which the app stores
      # link to. Until it's set, the policy says contact details are coming soon.
      - key: CONTACT_EMAIL
        sync: false
      # The line AdMob gives for app-ads.txt, e.g.
      # "google.com, pub-0000000000000000, DIRECT, f08c47fec0942fa0". /app-ads.txt is a 404
      # until it's set.
      - key: APP_ADS_TXT
        sync: false
