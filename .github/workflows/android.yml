# Builds an installable debug APK of the app on every PR. Download it from the run's
# Artifacts to try the app on an Android phone.
name: Android

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # AdMob ad unit ids (Settings → Secrets and variables → Actions → Variables). They ship
      # inside the app, so they aren't secrets. Without them the app shows Google's test ads.
      VITE_ADMOB_ANDROID_BANNER: ${{ vars.VITE_ADMOB_ANDROID_BANNER }}
      VITE_ADMOB_ANDROID_REWARDED: ${{ vars.VITE_ADMOB_ANDROID_REWARDED }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      # Capacitor 7's Android project compiles with Java 21.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the app and copy it into the Android project
        working-directory: app
        run: npm ci && npm run build && npx cap sync android
      - name: Assemble debug APK
        working-directory: app/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: pokechecks-debug-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
