# Checks every pull request and every push to main. The job names are what branch
# protection's required checks refer to, so rename them there too if they change here.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch makes an older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Matches rust-version in Cargo.toml and the Dockerfile's rust image.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked

  wasm:
    name: WASM build
    runs-on: ubuntu-latest
    env:
      # The app bundles this file, so keep an eye on its size. It was 555 KB when added.
      MAX_WASM_BYTES: 1000000
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # Must match the wasm-bindgen version pinned in crates/wasm/Cargo.toml.
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - name: Build
        run: |
          cargo build -p pokechecks-wasm --target wasm32-unknown-unknown --profile wasm --locked
          wasm-bindgen target/wasm32-unknown-unknown/wasm/pokechecks_wasm.wasm --target web --out-dir pkg
      - name: Size check
        run: |
          size=$(stat -c %s pkg/pokechecks_wasm_bg.wasm)
          echo "pokechecks_wasm_bg.wasm is $size bytes (limit $MAX_WASM_BYTES)"
          test "$size" -le "$MAX_WASM_BYTES"

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      # The same Dockerfile Render builds, so a broken deploy shows up here first.
      # Nothing is pushed anywhere.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
