[package]
name = "pokechecks-wasm"
version = "0.3.0"
edition = "2024"
rust-version = "1.99"
description = "PokeChecks' battle logic compiled to WebAssembly for the mobile app"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pokechecks-core = { path = "../core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde-wasm-bindgen = "0.6.5"
wasm-bindgen = "=0.2.129"
