<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the app draw behind the notch; styles pad with safe-area insets. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fff6e6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#17122e" media="(prefers-color-scheme: dark)" />
    <title>PokeChecks</title>
    <!-- The page colour before the stylesheet loads, so nothing flashes white. -->
    <style>
      html { background: #fff6e6; }
      @media (prefers-color-scheme: dark) { html { background: #17122e; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
